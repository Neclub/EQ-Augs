<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EQ Type 7/8 Augs</title>
<style>
:root {
  --bg: #0b0e11;
  --panel: #141820;
  --panel-hover: #1a2030;
  --header: #1e2430;
  --text: #eef0f4;
  --muted: #8b93a7;
  --border: #2a3140;
  --accent: #3b6fd4;
  --accent-soft: rgba(59, 111, 212, 0.15);
  --link: #8cb4ff;
  --bis: #22c55e;
  --bis-soft: rgba(34, 197, 94, 0.14);
  --upgrade: #eab308;
  --upgrade-soft: rgba(234, 179, 8, 0.14);
  --empty: #ef4444;
  --empty-soft: rgba(239, 68, 68, 0.14);
  --unknown: #60a5fa;
  --unknown-soft: rgba(96, 165, 250, 0.14);
  --owned: #166534;
  --farm: #9a3412;
  --warn-bg: #3f1d1d;
  --warn-border: #7f1d1d;
  --radius: 10px;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 8px 24px rgba(0, 0, 0, 0.25);
  --sticky-offset: 0px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(59, 111, 212, 0.12), transparent 55%),
    radial-gradient(900px 400px at 100% 0%, rgba(34, 197, 94, 0.06), transparent 50%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}
a {
  color: var(--link);
  text-decoration: none;
}
a:hover { text-decoration: underline; }
.hidden { display: none !important; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  backdrop-filter: blur(12px);
  background: rgba(11, 14, 17, 0.88);
  border-bottom: 1px solid var(--border);
  padding: 16px 28px 14px;
}
.topbar-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.topbar-main {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  flex: 1;
}
.topbar-logo {
  width: 96px;
  height: 96px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 0;
  background: transparent;
  filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45));
}
.topbar-logo:not([src]),
.topbar-logo[src=""] {
  display: none;
}
.topbar h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -0.02em;
}
.meta {
  color: var(--muted);
  font-size: 12.5px;
  line-height: 1.4;
}
.topbar-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px 18px;
  align-items: center;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  align-items: center;
}
.filters label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12.5px;
}
.filters select {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 11px;
  font: inherit;
  min-width: 10rem;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.filters select:hover { border-color: #3a4254; }
.filters select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.filter-count {
  color: var(--muted);
  font-size: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 3px 10px;
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--muted);
}
.swatch {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  display: inline-block;
}
.swatch.bis { background: var(--bis); }
.swatch.upgrade { background: var(--upgrade); }
.swatch.empty { background: var(--empty); }
.swatch.unknown { background: var(--unknown); }

.page {
  max-width: 1400px;
  margin: 0 auto;
  padding: 20px 28px 40px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.warnings {
  background: var(--warn-bg);
  border: 1px solid var(--warn-border);
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 13px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 16px;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(30, 36, 48, 0.65), transparent);
}
.card-head h2 {
  margin: 0;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.card-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  font-size: 15px;
  font-weight: 650;
  letter-spacing: -0.01em;
  cursor: pointer;
  text-align: left;
}
.card-toggle:hover { color: #fff; }
.card-toggle:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px var(--accent-soft);
  border-radius: 6px;
}
.card-toggle .chevron {
  width: 0.55em;
  height: 0.55em;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(45deg);
  transition: transform 0.15s ease;
  flex-shrink: 0;
}
.card.collapsed .card-toggle .chevron {
  transform: rotate(-45deg);
}
.card.collapsed .card-head {
  border-bottom: none;
}
.card.collapsed .card-body,
.card.collapsed .card-sub,
.card.collapsed .card-head .filters {
  display: none;
}
.card-sub {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
  width: 100%;
}
.card-body {
  padding: 0;
}
.card-body.fade {
  animation: fadeIn 0.18s ease;
}
@keyframes fadeIn {
  from { opacity: 0.55; transform: translateY(2px); }
  to { opacity: 1; transform: none; }
}
.table-scroll {
  overflow: auto;
  max-height: min(70vh, 820px);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
th, td {
  padding: 9px 12px;
  vertical-align: top;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
th {
  background: var(--header);
  color: #c5ccda;
  font-weight: 600;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  position: sticky;
  top: 0;
  z-index: 2;
  border-bottom-color: #343b4c;
}
tbody tr {
  transition: background 0.12s ease;
}
tbody tr:hover {
  background: var(--panel-hover);
}
tbody tr.status-bis {
  box-shadow: inset 3px 0 0 var(--bis);
  background: linear-gradient(90deg, var(--bis-soft), transparent 28%);
}
tbody tr.status-upgrade {
  box-shadow: inset 3px 0 0 var(--upgrade);
  background: linear-gradient(90deg, var(--upgrade-soft), transparent 28%);
}
tbody tr.status-empty {
  box-shadow: inset 3px 0 0 var(--empty);
  background: linear-gradient(90deg, var(--empty-soft), transparent 28%);
}
tbody tr.status-unknown {
  box-shadow: inset 3px 0 0 var(--unknown);
  background: linear-gradient(90deg, var(--unknown-soft), transparent 28%);
}
.status-pill {
  display: inline-flex;
  align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  white-space: nowrap;
}
.status-pill.bis { background: var(--bis-soft); color: #86efac; }
.status-pill.upgrade { background: var(--upgrade-soft); color: #fde68a; }
.status-pill.empty { background: var(--empty-soft); color: #fca5a5; }
.status-pill.unknown { background: var(--unknown-soft); color: #93c5fd; }
.badge {
  display: inline-block;
  margin-left: 6px;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.02em;
  vertical-align: middle;
}
.badge-owned { background: var(--owned); color: #ecfdf5; }
.badge-farm { background: var(--farm); color: #fff7ed; }
.badge-component { background: #1e3a5f; color: #bfdbfe; }
.empty-msg {
  color: var(--muted);
  margin: 0;
  padding: 22px 16px;
  font-size: 13px;
}
.muted-cell { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

@media (max-width: 720px) {
  .topbar, .page { padding-left: 14px; padding-right: 14px; }
  .topbar h1 { font-size: 18px; }
  .topbar-logo { width: 72px; height: 72px; }
  th, td { padding: 8px 9px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-main">
      <h1 id="reportTitle">Type 7/8 Augs</h1>
      <div class="meta" id="meta"></div>
      <div class="topbar-controls">
        <div class="filters" id="charFilters"></div>
        <div class="legend">
          <span><i class="swatch bis"></i> BiS</span>
          <span><i class="swatch upgrade"></i> Upgrade</span>
          <span><i class="swatch empty"></i> Empty</span>
          <span><i class="swatch unknown"></i> Unknown</span>
        </div>
      </div>
    </div>
    <img class="topbar-logo" id="reportLogo" alt="EQ Augs" width="96" height="96">
  </div>
</header>

<main class="page">
  <div class="warnings hidden" id="warnings"></div>

  <section class="card" id="summaryCard">
    <div class="card-head">
      <h2>
        <button type="button" class="card-toggle" aria-expanded="true" aria-controls="statSummaryWrap">
          <span class="chevron" aria-hidden="true"></span>
          Stat summary
        </button>
      </h2>
      <p class="card-sub" id="statSummarySub">Totals if Upgrade/Empty slots use the suggested augs.</p>
    </div>
    <div class="card-body" id="statSummaryWrap"></div>
  </section>

  <section class="card" id="upgradesCard">
    <div class="card-head">
      <h2>
        <button type="button" class="card-toggle" aria-expanded="true" aria-controls="tableWrap">
          <span class="chevron" aria-hidden="true"></span>
          Slot recommendations
        </button>
      </h2>
    </div>
    <div class="card-body" id="tableWrap"></div>
  </section>

  <section class="card collapsed" id="farmCard">
    <div class="card-head">
      <h2>
        <button type="button" class="card-toggle" aria-expanded="false" aria-controls="farmWrap">
          <span class="chevron" aria-hidden="true"></span>
          Need to farm
        </button>
      </h2>
      <div class="filters" id="farmFilters"></div>
    </div>
    <div class="card-body" id="farmWrap"></div>
  </section>

  <section class="card collapsed" id="rankedCard">
    <div class="card-head">
      <h2>
        <button type="button" class="card-toggle" aria-expanded="false" aria-controls="rankedWrap">
          <span class="chevron" aria-hidden="true"></span>
          Ranked reference augs
        </button>
      </h2>
      <div class="filters" id="refFilters"></div>
    </div>
    <div class="card-body" id="rankedWrap"></div>
  </section>
</main>

<script>
const REPORT = /*__REPORT_JSON__*/;
const EQRESOURCE_URL = REPORT.eqResourceItemUrl || "https://items.eqresource.com/items.php?id={item_id}";
const STATUS_LABELS = {
  bis: "BiS",
  upgrade: "Upgrade",
  empty: "Empty",
  unknown: "Unknown",
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function itemHref(id) {
  return EQRESOURCE_URL.replace("{item_id}", String(id));
}
function itemLink(name, id) {
  if (!name) return "";
  if (id) {
    return `<a href="${esc(itemHref(id))}" target="_blank" rel="noopener">${esc(name)}</a>`;
  }
  return esc(name);
}
function componentBadge(craftOwned, craftName) {
  if (craftOwned && craftName) {
    return `<span class="badge badge-component">Have ${esc(craftName)}</span>`;
  }
  return "";
}
function ownershipBadge(owned, moveFrom, craftOwned, craftName) {
  if (moveFrom) {
    return `<span class="badge badge-owned">Move from ${esc(moveFrom)}</span>`;
  }
  if (owned === true) return `<span class="badge badge-owned">Owned</span>`;
  if (owned === false) {
    return `<span class="badge badge-farm">Need to farm</span>` +
      componentBadge(craftOwned, craftName);
  }
  return "";
}
function statusPill(status) {
  const key = String(status || "").toLowerCase();
  const label = STATUS_LABELS[key] || status || "—";
  const cls = STATUS_LABELS[key] ? key : "unknown";
  return `<span class="status-pill ${esc(cls)}">${esc(label)}</span>`;
}
function uniqueSorted(values) {
  return [...new Set(values.filter(Boolean))].sort((a, b) =>
    String(a).localeCompare(String(b), undefined, { sensitivity: "base" })
  );
}
function slotLabel(a) {
  if (a.earOnly) return "Ear only";
  if (a.shieldOnly) return "Shield only";
  if (a.slotText) return a.slotText;
  if (a.excluded && a.excluded.length) return "All except " + a.excluded.join(", ");
  return "All";
}
function selectedCharacterKey() {
  const sel = document.getElementById("characterFilter");
  return sel ? sel.value : "";
}
function selectedCharacter() {
  const key = selectedCharacterKey();
  if (!key || !REPORT.characters || !REPORT.characters.length) return null;
  return REPORT.characters.find(c =>
    c.personaKey === key || c.columnLabel === key || c.character === key
  ) || null;
}
function characterTitleName(ch) {
  if (!ch) return null;
  const name = (ch.character || "").trim();
  const cls = (ch.classAbbr || "").trim().toUpperCase();
  if (!name) return null;
  return cls ? `${name} - ${cls}` : name;
}
function characterFilterLabel(ch) {
  if (!ch) return "";
  return characterTitleName(ch) || ch.columnLabel || ch.character || "";
}
function flash(el) {
  if (!el) return;
  el.classList.remove("fade");
  void el.offsetWidth;
  el.classList.add("fade");
}
function tableHtml(head, bodyRows) {
  return `<div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody>${bodyRows}</tbody></table></div>`;
}
function renderTitle() {
  if (!REPORT) return;
  const ch = selectedCharacter();
  const subject = characterTitleName(ch);
  const title = subject
    ? `${subject} Type 7/8 Augs`
    : (REPORT.reportTitle || "EQ Type 7/8 Augs");
  document.title = title;
  const h1 = document.getElementById("reportTitle");
  if (h1) h1.textContent = title;
}
function renderMeta() {
  if (!REPORT) {
    document.getElementById("meta").textContent = "No report data.";
    return;
  }
  const ch = selectedCharacter();
  const profileLabel = (ch && ch.profileLabel) || REPORT.profileLabel;
  const server = (ch && ch.server) || REPORT.server;
  const meta = [
    profileLabel,
    server ? `Server: ${server}` : null,
    `Artisan's Prize: ${REPORT.artisansPrizeOwned ? "owned" : "not owned"}`,
    `Anniversary augs: ${REPORT.includeAnniversary ? "included" : "excluded"}`,
    REPORT.catalogFromCache ? `Catalog: cache (${REPORT.catalogFetchedAt})` : `Catalog: live (${REPORT.catalogFetchedAt})`,
    REPORT.appVersion ? `EQ Augs ${REPORT.appVersion}` : null,
  ].filter(Boolean).join(" · ");
  document.getElementById("meta").textContent = meta;
}
function signed(n) {
  const v = Number(n) || 0;
  return v > 0 ? `+${v}` : String(v);
}
function renderStatSummary() {
  const rows = REPORT.statSummary || [];
  const wrap = document.getElementById("statSummaryWrap");
  if (!wrap) return;
  const key = selectedCharacterKey();
  const filtered = key
    ? rows.filter(r => r.personaKey === key || r.columnLabel === key || r.character === key)
    : rows;

  if (!rows.length) {
    wrap.innerHTML = '<p class="empty-msg">No suggested upgrades to summarize.</p>';
    flash(wrap);
    return;
  }
  if (!filtered.length) {
    wrap.innerHTML = '<p class="empty-msg">No summary for this character.</p>';
    flash(wrap);
    return;
  }

  const head =
    "<th>Character</th><th>Slots</th><th>Focus</th><th>AC</th><th>HP</th><th>ATK</th>" +
    "<th>Heal</th><th>Spell Dmg</th><th>Clairvoyance</th>";
  let body = "";
  filtered.forEach(r => {
    const focusLabel = r.focusLabel || REPORT.focusLabel || "HDex";
    body += `<tr>` +
      `<td>${esc(r.columnLabel || r.character)}</td>` +
      `<td class="num">${r.slotsChanged || 0}</td>` +
      `<td class="num">${signed(r.focus)} ${esc(focusLabel)}</td>` +
      `<td class="num">${signed(r.ac)}</td>` +
      `<td class="num">${signed(r.hp)}</td>` +
      `<td class="num">${signed(r.atk)}</td>` +
      `<td class="num">${signed(r.healAmount)}</td>` +
      `<td class="num">${signed(r.spellDamage)}</td>` +
      `<td class="num">${signed(r.clairvoyance)}</td>` +
      `</tr>`;
  });
  wrap.innerHTML = tableHtml(head, body);
  flash(wrap);
}
function renderUpgrades() {
  const upgrades = REPORT.upgrades || [];
  const wrap = document.getElementById("tableWrap");
  const key = selectedCharacterKey();
  const rows = key
    ? upgrades.filter(u => u.personaKey === key || u.character === key)
    : upgrades;

  if (!upgrades.length) {
    wrap.innerHTML = '<p class="empty-msg">No graded type 7/8 slots found.</p>';
    flash(wrap);
    return;
  }
  if (!rows.length) {
    wrap.innerHTML = '<p class="empty-msg">No rows for this character.</p>';
    flash(wrap);
    return;
  }

  const head =
    "<th>Status</th><th>Character</th><th>Slot</th><th>Current</th><th>Upgrade to</th><th>Expansion</th><th>Note</th>";
  let body = "";
  rows.forEach(u => {
    const cur = u.currentName
      ? itemLink(u.currentName, u.currentId)
      : '<span class="muted-cell">(empty)</span>';
    const rec = u.recommendedName
      ? itemLink(u.recommendedName, u.recommendedId) + ownershipBadge(
          u.recommendedOwned,
          u.moveFromSlot,
          u.craftComponentOwned,
          u.craftComponentName
        )
      : "";
    const exp = u.recommendedExpansion ? esc(u.recommendedExpansion) : "";
    const status = String(u.status || "").toLowerCase();
    body += `<tr class="status-${esc(status)}">` +
      `<td>${statusPill(status)}</td>` +
      `<td>${esc(u.character)}</td>` +
      `<td>${esc(u.gearSlot)}</td>` +
      `<td>${cur}</td>` +
      `<td>${rec}</td>` +
      `<td>${exp}</td>` +
      `<td class="muted-cell">${esc(u.note || "")}</td>` +
      "</tr>";
  });
  wrap.innerHTML = tableHtml(head, body);
  flash(wrap);
}
function renderFarm() {
  const farm = REPORT.farmList || [];
  const wrap = document.getElementById("farmWrap");
  const key = selectedCharacterKey();
  const sortSel = document.getElementById("farmSort");
  const sortBy = sortSel ? sortSel.value : "character";
  let rows = key
    ? farm.filter(f => f.personaKey === key || f.character === key)
    : farm.slice();

  const cmpText = (a, b) =>
    String(a || "").localeCompare(String(b || ""), undefined, { sensitivity: "base" });
  rows = rows.slice().sort((a, b) => {
    if (sortBy === "aug") {
      return cmpText(a.name, b.name)
        || cmpText(a.character, b.character)
        || cmpText(a.gearSlot, b.gearSlot);
    }
    return cmpText(a.character, b.character)
      || cmpText(a.name, b.name)
      || cmpText(a.gearSlot, b.gearSlot);
  });

  const countEl = document.getElementById("farmFilterCount");
  if (countEl) {
    countEl.textContent = key
      ? `${rows.length} of ${farm.length} augs`
      : `${farm.length} augs`;
  }

  if (!farm.length) {
    wrap.innerHTML = '<p class="empty-msg">No recommended upgrades to farm — inventory already has them, or no upgrades recommended.</p>';
    flash(wrap);
    return;
  }
  if (!rows.length) {
    wrap.innerHTML = '<p class="empty-msg">No farm targets for this character.</p>';
    flash(wrap);
    return;
  }

  const head = "<th>Character</th><th>Slot</th><th>Aug</th><th>ID</th><th>Expansion</th>";
  let body = "";
  rows.forEach(f => {
    const aug = itemLink(f.name, f.itemId) +
      componentBadge(f.craftComponentOwned, f.craftComponentName);
    body += "<tr>" +
      `<td>${esc(f.character)}</td>` +
      `<td>${esc(f.gearSlot)}</td>` +
      `<td>${aug}</td>` +
      `<td class="num muted-cell">${f.itemId}</td>` +
      `<td>${esc(f.expansion || "")}</td>` +
      "</tr>";
  });
  wrap.innerHTML = tableHtml(head, body);
  flash(wrap);
}
function renderRanked() {
  const augs = REPORT.rankedAugs || [];
  const wrap = document.getElementById("rankedWrap");
  const typeSel = document.getElementById("refTypeFilter");
  const focusSel = document.getElementById("refFocusFilter");
  const type = typeSel ? typeSel.value : "";
  const focus = focusSel ? focusSel.value : (REPORT.defaultFocusFilter || "");
  const focusLabel = focus || REPORT.focusLabel || "HDex";

  let filtered = augs;
  if (focus) filtered = filtered.filter(a => (a.focusLabel || "") === focus);
  if (type) filtered = filtered.filter(a => a.refType === type);

  const countEl = document.getElementById("refFilterCount");
  if (countEl) {
    countEl.textContent = (focus || type)
      ? `${filtered.length} of ${augs.length} augs`
      : `${augs.length} augs`;
  }

  if (!augs.length) {
    wrap.innerHTML = '<p class="empty-msg">No ranked reference augs.</p>';
    flash(wrap);
    return;
  }
  if (!filtered.length) {
    wrap.innerHTML = '<p class="empty-msg">No reference augs for this filter.</p>';
    flash(wrap);
    return;
  }

  const head =
    `<th>#</th><th>Name</th><th>ID</th><th>${esc(focusLabel)}</th><th>AC</th><th>HP</th>` +
    "<th>ATK</th><th>Heal</th><th>Spell Dmg</th><th>Clrv</th><th>Type</th><th>Slots</th><th>Source</th>";
  let body = "";
  filtered.forEach((a, i) => {
    const st = a.stats || {};
    const atk = a.atk || st.atk || 0;
    const heal = a.healAmount != null ? a.healAmount : (st.heal_amount || 0);
    const sd = a.spellDamage != null ? a.spellDamage : (st.spell_damage || 0);
    const clrv = a.clairvoyance != null ? a.clairvoyance : (st.clairvoyance || 0);
    body += `<tr><td class="num muted-cell">${i + 1}</td>` +
      `<td>${itemLink(a.name, a.itemId)}</td>` +
      `<td class="num muted-cell">${a.itemId}</td>` +
      `<td class="num">${a.focusHeroic}</td>` +
      `<td class="num">${a.ac}</td>` +
      `<td class="num">${a.hp}</td>` +
      `<td class="num">${atk}</td>` +
      `<td class="num">${heal}</td>` +
      `<td class="num">${sd}</td>` +
      `<td class="num">${clrv}</td>` +
      `<td>${esc(a.refType || "General")}</td>` +
      `<td class="muted-cell">${esc(slotLabel(a))}</td>` +
      `<td class="muted-cell">${esc(a.source)}</td></tr>`;
  });
  wrap.innerHTML = tableHtml(head, body);
  flash(wrap);
}
function onCharacterFilterChange() {
  renderTitle();
  renderMeta();
  renderStatSummary();
  renderUpgrades();
  renderFarm();
}
function render() {
  if (!REPORT) {
    document.getElementById("meta").textContent = "No report data.";
    return;
  }

  const logo = document.getElementById("reportLogo");
  if (logo && REPORT.logoDataUri) {
    logo.src = REPORT.logoDataUri;
  }

  if (REPORT.warnings && REPORT.warnings.length) {
    const w = document.getElementById("warnings");
    w.classList.remove("hidden");
    w.innerHTML = REPORT.warnings.map(x => `<div>${esc(x)}</div>`).join("");
  }

  const chars = REPORT.characters || [];
  const charOptions = chars.length
    ? chars.map(c => ({
        value: c.personaKey || c.columnLabel || c.character,
        label: characterFilterLabel(c),
      }))
    : uniqueSorted((REPORT.upgrades || []).map(u => u.character)).map(name => ({
        value: name,
        label: name,
      }));

  const charFilters = document.getElementById("charFilters");
  if (charOptions.length > 1) {
    charFilters.innerHTML =
      `<label>Character <select id="characterFilter">` +
      `<option value="">All characters</option>` +
      charOptions.map(o =>
        `<option value="${esc(o.value)}">${esc(o.label)}</option>`
      ).join("") +
      `</select></label>`;
    document.getElementById("characterFilter").addEventListener("change", onCharacterFilterChange);
  } else {
    charFilters.innerHTML = "";
  }

  document.getElementById("farmFilters").innerHTML =
    `<label>Sort by <select id="farmSort">` +
    `<option value="character">Character</option>` +
    `<option value="aug">Aug</option>` +
    `</select></label>` +
    `<span class="filter-count" id="farmFilterCount"></span>`;
  document.getElementById("farmSort").addEventListener("change", renderFarm);

  const types = uniqueSorted((REPORT.rankedAugs || []).map(a => a.refType || "General"));
  const typeOrder = ["General", "Charm/Range", "Charm", "Range", "Ear", "Shield"];
  types.sort((a, b) => {
    const ia = typeOrder.indexOf(a);
    const ib = typeOrder.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  const focusOptions = (REPORT.rankedProfiles && REPORT.rankedProfiles.length)
    ? REPORT.rankedProfiles.map(p => ({
        value: p.label,
        label: `${p.label} — ${p.profileLabel}`,
      }))
    : uniqueSorted((REPORT.rankedAugs || []).map(a => a.focusLabel || REPORT.focusLabel || "HDex"))
        .map(label => ({ value: label, label }));

  const defaultFocus = REPORT.defaultFocusFilter || "HDex";
  const showFocusFilter = focusOptions.length > 1;
  const initialFocus = showFocusFilter
    ? (focusOptions.some(o => o.value === defaultFocus) ? defaultFocus : focusOptions[0].value)
    : (focusOptions[0] ? focusOptions[0].value : defaultFocus);

  const refFilters = document.getElementById("refFilters");
  let filtersHtml = "";
  if (showFocusFilter) {
    filtersHtml +=
      `<label>Focus <select id="refFocusFilter">` +
      focusOptions.map(o =>
        `<option value="${esc(o.value)}"${o.value === initialFocus ? " selected" : ""}>${esc(o.label)}</option>`
      ).join("") +
      `</select></label>`;
  } else {
    filtersHtml += `<select id="refFocusFilter" class="hidden"><option value="${esc(initialFocus)}" selected></option></select>`;
  }
  filtersHtml +=
    `<label>Type <select id="refTypeFilter">` +
    `<option value="">All types</option>` +
    types.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join("") +
    `</select></label>` +
    `<span class="filter-count" id="refFilterCount"></span>`;
  refFilters.innerHTML = filtersHtml;
  document.getElementById("refFocusFilter").addEventListener("change", renderRanked);
  document.getElementById("refTypeFilter").addEventListener("change", renderRanked);

  document.querySelectorAll(".card-toggle").forEach(btn => {
    btn.addEventListener("click", () => {
      const card = btn.closest(".card");
      if (!card) return;
      const collapsed = card.classList.toggle("collapsed");
      btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
    });
  });

  renderTitle();
  renderMeta();
  renderStatSummary();
  renderUpgrades();
  renderFarm();
  renderRanked();
}
render();
</script>
</body>
</html>
